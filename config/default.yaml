# DA3-SLAM default hyperparameters
# All values here are the authoritative defaults.
# Override any key from the CLI: --submap_size 12, --loop_threshold 0.9, etc.

# ══════════════════════════════════════════════════════════════════════════════
# THESE DEFAULTS ARE TUNED FOR INDOOR HANDHELD RGB (TUM / Replica / 7-Scenes).
#
# Measured on TUM fr1 (9 seq) and Replica (8 scenes), 3 repeats (run-to-run
# spread < 1e-5, i.e. the pipeline is deterministic there):
#     TUM      Sim3 ATE 0.0389 -> 0.0295   (8/9 vs VGGT-SLAM 2.0's 0.0383)
#     Replica  Sim3 ATE 0.0561 -> 0.0080   (8/8 vs VGGT-SLAM 2.0's 0.0304)
#
# DO NOT USE THESE ON AERIAL / KM-SCALE FOOTAGE.  THREE of them diverge there:
# `boundary_scale_damping: 0.0` collapses scale on UAS (+29..58% ATE, scale
# down to 0.097); `loop_closure.distance_threshold: 0.80` drives the SL(4)
# graph off the rigid manifold on all four UAS sequences (trajectory export
# fails with a non-positive determinant — re-confirmed 2026-09-15, 0/4); and
# `submap_size: 32` costs 2.4x on the two tunnel sequences.
# For that domain use: damping 1.0, distance_threshold 0.45, submap_size 16.
#
# SUBMAP SIZE IS DOMAIN-DEPENDENT AND THIS WAS NOT PREVIOUSLY DOCUMENTED.
# A submap is one DA3 batch, and DA3 estimates its geometry by attending
# BETWEEN views, which needs the views to still overlap.  submap_size counts
# KEYFRAMES, not view change, and keyframes are picked at a fixed frame stride
# — so a fixed count spans whatever distance the camera travelled:
#     TUM fr1/teddy   2.8 m per submap      UAS fyllingsdalen  51 m
#     Replica room2   3.3 m per submap      UAS hornbill       65 m
# At 65 m the first and last frames of a batch share no visible surface.
# Measured (damping 1.0, thr 0.45, gate 0.2, % of GT path length):
#     sequence        submap_size 32   submap_size 16   m/submap 32 -> 16
#     fyllingsdalen        12.0%            5.0%            51 -> 27
#     hornbill             11.8%            5.3%            65 -> 33
#     campus_fog           10.5%            8.0%             8 ->  4
# campus_fog was never span-limited and barely moves; the two tunnels recover
# completely.  The 5.0-9.0% UAS figures quoted for this system were measured at
# submap_size 16 — they do NOT hold at 32.
# ══════════════════════════════════════════════════════════════════════════════

# ── DA3 model ──────────────────────────────────────────────────────────────────
# nested-giant (anyview GIANT + DA3METRIC-LARGE): the small->giant ladder measured
# ~3x worse on TUM, and it is the only family with cross-view attention.
depth_model: "depth-anything/DA3NESTED-GIANT-LARGE-1.1"
depth_model_resolution: 504
use_ray_pose: false  # use ray-based pose estimation instead of camera decoder

# ViT backbone weight precision: "fp32" or "bf16".
# The backbones already run under autocast bf16, so their fp32 master copies are
# storage the forward never benefits from: bf16 cuts peak GPU memory ~40%
# (11.8 -> 7.1 GB at submap 16) and roughly doubles the reachable submap size.
# Validated on UAS (54.39 vs 55.01 m, 7774 vs 12544 MB) and used for every
# benchmark number quoted above.
backbone_dtype: bf16

# ── cross-view token merging (FastVGGT port — EXPERIMENTAL, off by default) ────
# Training-free acceleration of the backbone's global (cross-view) attention:
# most tokens are merged into a smaller destination set before attention and
# scattered back afterwards.  See da3_slam/backend/inference/token_merge.py and
# plan_fastvggt-token-merging.txt.
#
# `enable: false` is the baseline every merged run must be compared against —
# with it off, the backbone runs exactly as upstream DA3 does.
token_merging:
  enable: false
  start: 0            # first merging block, as a POSITION among the global
                      # blocks (0 = all).  giant has 14, large has 8, so only
                      # the relative position transfers across model sizes.
  merge_ratio: 0.9    # fraction of tokens absorbed into the destination set
  sx: 2               # destination stride over the patch grid (x)
  sy: 2               # destination stride over the patch grid (y)
  protect: true       # hold a uniform stride of tokens out of the merge
  protect_ratio: 0.1
  seed: 33            # destination-choice seed (fixed = reproducible config)
  min_frames: 8       # never merge smaller batches — keeps the loop-closure
                      # worker's re-inference on the exact path

# ── semantic embeddings (optional) ─────────────────────────────────────────────
# Set to a HuggingFace CLIP model ID to enable open-vocabulary scene queries.
# Requires: pip install transformers
# Example: "openai/clip-vit-large-patch14"
semantic_model: null

# ── submap ─────────────────────────────────────────────────────────────────────
submap_size: 32                # max keyframes per submap (including anchor overlap).
                                # Swept {8,16,32,64} on TUM fr1 at the shipped
                                # config with keyframes frozen per sequence:
                                # mean Sim3 ATE 0.0324 / 0.0295 / 0.0267 / 0.0270.
                                # 32 wins 6/9 vs 16 (-9.6%) for +526 MB peak and
                                # no speed cost; 64 ties on the mean but degrades
                                # room and teddy.  NOTE the old "bigger submaps
                                # are worse" result was measured with
                                # boundary_scale_damping 1.0, where the scale
                                # chain was inert and boundary COUNT barely
                                # mattered.  With chaining on, submap size sets
                                # the number of boundaries, so the ordering
                                # reversed.  Watch: loop closures fall 3.8 -> 1.7
                                # per sequence from 16 to 32 (fewer submaps, so
                                # fewer eligible retrieval pairs).
# ── submap size ramp (online-safe guard against a one-submap sequence) ────────
# The first `submap_warmup_submaps` submaps hold `submap_warmup_size` keyframes;
# the size then DOUBLES every `submap_warmup_submaps` submaps up to
# `submap_size`.  At the shipped values that is 16, 16, 32, 32, 32, ...
#
# WHY: a short sequence at submap_size 32 can yield exactly ONE submap, which
# silently disables the entire SLAM layer at once — no boundary to chain, a
# one-node SL(4) graph with nothing to optimise, and loop closure structurally
# impossible (min_submaps_apart >= 1 cannot be met).  Measured on
# 7-Scenes/stairs (500 frames -> 32 keyframes -> 1 submap): ATE 0.1149 with
# scale 1.140, versus 0.0305 and scale 1.008 with this ramp, which gives it 3
# submaps.  A 3.8x difference produced purely by whether the pose graph exists.
#
# The ramp is CAUSAL — it depends only on how many submaps have been emitted,
# never on total sequence length — so it works online where the length is
# unknown.  Differing submap sizes need no special handling: graph nodes are
# submaps and factors are relative poses at shared anchors, so no re-inference
# is required.
#
# Measured cost/benefit vs fixed 32 (DASH-SLAM, 1 repeat, Sim3 ATE):
#     TUM      0.0267 -> 0.0277  (+3.9%)
#     Replica  0.0089 -> 0.0092  (+3.0%, within per-scene spread)
#     7-Scenes 0.0652 -> 0.0531  (-18.6%, entirely from stairs)
# A steeper ramp (8, 16, 32, 64, cap 128) was WORSE everywhere — TUM 0.0291,
# Replica 0.0094, 7-Scenes 0.0539 — because an 8-keyframe first submap has
# weak DA3 cross-view geometry exactly where errors propagate furthest.  The
# benefit comes from guaranteeing a minimum submap COUNT, not from growth.
# Set submap_warmup_size: 0 to restore fixed-size behaviour exactly.
submap_warmup_size: 16
submap_warmup_submaps: 2

submap_overlap: 1              # anchor keyframes shared between consecutive submaps.
                                # 1 = single shared node (VGGT-SLAM style).  >= 2
                                # measures the shared frame pair in both DA3 batches:
                                # redundant boundary between-factor + consistency
                                # check, so one bad anchor pose cannot silently
                                # displace a whole submap (the live demo uses 2).

# Extra within-submap between-factors linking frames k apart (e.g. [2, 4, 8]).
# DA3 estimates each batch jointly, so a stride-k relative pose is ONE direct
# measurement, not k composed ones — free information the consecutive-only
# chain discards.  It also makes the graph over-determined; a consecutive-only
# chain has exactly as many factors as nodes, so the noise model cannot affect
# it.  [] = consecutive links only (previous behaviour).
# Pose-graph parameterisation: "sl4" (15 DOF projective, as VGGT-SLAM) or
# "sim3" (7 DOF rigid + uniform scale).  Inert in a chain-only graph, which is
# exactly determined; only matters where loop closures / overlap>=2 add
# redundancy.
pose_parameterisation: sl4

submap_skip_strides: []

# ── inter-submap scale chaining ────────────────────────────────────────────────
# Each DA3 batch has its own metric scale; consecutive submaps are chained by
# the median depth ratio at the shared anchor frame.  Ratio noise compounds
# multiplicatively over boundaries (= scale drift on long sequences).  DA3
# depth is nominally metric, so the true ratio should be near 1.0:
boundary_scale_damping: 0.0    # g in [0,1]: each ratio is raised to (1-g).
                                # 0 = full chaining (INDOOR DEFAULT); 1 = ignore
                                # ratios and trust DA3's metric consistency.
                                # DOMAIN-DEPENDENT, measured: chaining is worth
                                # -24% Sim3 ATE on TUM and -86% on Replica, but
                                # +29..58% on UAS, where it drives scale to
                                # 0.097-0.381.  Use 1.0 for aerial/km-scale.
                                # (The earlier 1.0 default came from a sweep
                                # that ran with 0-1 loop closures per sequence;
                                # chained drift is unconstrained without graph
                                # cycles, so that result does not transfer to
                                # the tuned system, which closes 3-6 loops.)
boundary_scale_clamp: null     # c > 1 clamps each applied ratio to [1/c, c],
                                # guarding against one bad boundary estimate.
                                # null = off.
boundary_scale_deadband: 0.0   # d > 0: ratios with max(r,1/r)-1 <= d are forced
                                # to 1.0 (metric-consistent regime, as validated
                                # by the sweeps), but ratios outside the band are
                                # applied in FULL, ignoring damping — a genuine
                                # per-batch metric scale break (live D455 runs
                                # showed 2-6x jumps; the trajectory stretches and
                                # the map rebuilds elsewhere).  The live demo
                                # uses 0.25.  0 = off (damping behaviour only).

# ── keyframe selection (Lucas-Kanade optical flow) ─────────────────────────────
keyframe:
  min_disparity_fraction: 0.10  # min mean flow as fraction of image width
  max_submap_size: 20           # kept in sync with top-level submap_size
  max_corners: 500              # goodFeaturesToTrack: number of corners
  quality_level: 0.01           # goodFeaturesToTrack: minimum quality
  min_distance: 8.0             # goodFeaturesToTrack: minimum corner distance (px)
  block_size: 7                 # goodFeaturesToTrack: neighbourhood size for covariance matrix
  flow_window_size: [21, 21]    # calcOpticalFlowPyrLK: window size
  flow_pyramid_levels: 3        # calcOpticalFlowPyrLK: pyramid levels
  flow_stop_criteria: [3, 30, 0.01]  # calcOpticalFlowPyrLK: [type(EPS|COUNT=3), maxCount, epsilon]
  flow_downsample_factor: 1     # downsample before flow; reduces cost ~factor^2 with negligible accuracy loss

  # Selection policy: "disparity" (frame-level threshold, VGGT-SLAM-style) or
  # "segment" (segment-level density control, Choi et al. IEEE Access 2026).
  selection_mode: segment
  segment_length: 128                # N_S: frames per non-overlapping segment
  segment_disparity_threshold: 650.0 # tau_seg: accumulated flow (px) -> dense stride
  segment_strides: [8, 16]           # (a, b): dense stride if D_seg > tau_seg, else sparse

  # Blur gating (motion blur poisons DA3 poses, descriptors and re-inference
  # at once; fast motion still yields sharp frames at direction reversals):
  sharpness_window: 0        # segment mode: swap each stride-picked keyframe for
                             # the sharpest frame within ±window (Laplacian
                             # variance).  0 = off.  The live demo uses 2.
  min_sharpness_ratio: 0.0   # disparity mode: defer a keyframe whose sharpness is
                             # below this fraction of the recent median (the
                             # max_submap_size force still applies).  0 = off.
                             # The live demo uses 0.5.

# ── point cloud filtering ──────────────────────────────────────────────────────
confidence_percentile: 65.0    # global confidence percentile threshold (0-100)
                                # higher = fewer but cleaner points

# ── pose graph noise ───────────────────────────────────────────────────────────
# SL(4) noise is 15-dimensional (isotropic scalar applied to all 15 dims).
# Mirrors VGGT-SLAM's noise configuration exactly.
noise:
  prior_sigma: 1.0e-6   # very tight anchor on the first keyframe
  between_sigma: 0.05   # inner-submap consecutive-frame between factors
  loop_sigma: 0.05      # loop closure between factors
  loop_huber_k: 1.345   # Huber M-estimator k on loop factors: a wrong closure
                        # (perceptual aliasing) is down-weighted instead of
                        # warping the map.  null = plain Gaussian.
  between_huber_k: null # Huber k on odometry between factors.  Only acts where
                        # the graph has redundancy (overlap>=2 boundary pairs,
                        # loop-closure cycles): a broken boundary measurement
                        # then absorbs its own error instead of deforming the
                        # whole cycle (side-by-side ghost copies of revisited
                        # geometry).  The live demo uses 1.345.  null = off.

# ── loop closure ───────────────────────────────────────────────────────────────
loop_closure:
  enable: true
  distance_threshold: 0.80     # DINO-SALAD L2 distance to flag a frame-level candidate.
                                # 0.45 finds almost nothing indoors (it sits at the
                                # 6th percentile of observed distances); 0.80 tripled
                                # closures and cut TUM ATE ~30%.  The live RealSense
                                # demo overrides to 0.55 — see run_realsense.py.
                                # AERIAL: use 0.45.  On UAS, 0.80 admits aliased
                                # matches (tunnels/fog/ice are self-similar) and the
                                # SL(4) graph leaves the rigid manifold — 15 of 38
                                # candidates accepted and the run diverges.
  min_submaps_apart: 1          # minimum index gap to consider a loop
  max_loop_closures: 1          # top-K candidates kept per submap (priority queue)
  min_confidence_ratio: 0.05    # minimum mean DA3 confidence (over the two matched
                                # frames) to accept a closure.  NOTE the quantity is
                                # min-max normalised PER FRAME, so it is not
                                # comparable across scenes: a healthy match scores
                                # ~0.6 on fr1/desk but ~0.066 on fr1/plant, whose
                                # low-parallax orbit (0.048) conditions the wide-
                                # baseline re-inference poorly.  The old 0.3 rejected
                                # all 3 of plant's candidates; 0.05 admits them and
                                # cuts its ATE 46%.  A gate on a scale-stable
                                # quantity would be the principled fix.
  roma_gate: false        # dense-matching verification (RoMa v2).  With it on,
  roma_min_overlap: 0.30  # set distance_threshold loose — retrieval becomes a
                          # recall knob and precision comes from correspondence.
  context_frames: 1             # temporal neighbours per matched frame included in
                                # the verification re-inference (0 = pair only);
                                # multi-view support conditions both the relative
                                # pose and the confidence gate
  max_rotation_error_deg: 90.0  # geometric gate: reject closures whose measured
                                # relative pose disagrees with the graph prediction
                                # by more than this rotation (null = off)
  max_translation_error: null   # same gate on translation discrepancy (global
                                # metric units, ~m).  Keep well above worst
                                # plausible drift; the RealSense demo uses 3.0.
                                # null = off.
